<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ТЗ практики · JS 2</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5f6fb;--paper:#fff;--ink:#22233c;--muted:#858a9f;--line:#e8eaf2;--purple:#7956f7;--code:#181b2d}
    @media (prefers-color-scheme:dark){:root{--bg:#111323;--paper:#1a1d30;--ink:#f5f4ff;--muted:#a5a8c2;--line:#32364f}}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif}
    main{max-width:1000px;margin:0 auto;padding:32px 16px 60px}
    h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.04em;margin:0 0 6px}
    p{color:var(--muted);font-weight:600;margin:0 0 22px}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
    .bar a{background:var(--purple);color:#fff;text-decoration:none;font-weight:800;padding:11px 16px;border-radius:11px}
    .bar a.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
    h2{font:500 14px "JetBrains Mono",monospace;color:var(--muted);margin:26px 0 8px}
    pre{background:var(--code);color:#e3e7fa;border-radius:14px;padding:18px 20px;overflow:auto;font:500 14px/1.7 "JetBrains Mono",monospace;margin:0}
    .c{color:#aab2d0}
    .st{color:#c9a6ff;font-weight:600}.lb{color:#70c8e9;font-weight:600}.ok{color:#b1e0a2;font-weight:600}.no{color:#eb9ac6;font-weight:600}.cd{color:#f5c582}.br{color:#5d6584}
  </style>
</head>
<body>
<main>
  <h1 id="title">ТЗ практики</h1>
  <p>Код пишем сами, под каждым пунктом. Здесь — только задание. Скачайте ZIP и откройте папку в VS Code.</p>
  <div class="bar"><a id="zip" href="#">↓ Скачать ZIP</a><a class="sec" href="/">← К презентации</a></div>
  <div id="files"></div>
</main>
<script>
  const SETS = {
    joint: { title: 'Вместе: анкета ученика', files: ['script.js'] },
    solo: { title: 'Самостоятельно: карточка товара', files: ['script.js'] },
    homework: { title: 'Домашнее задание: чек в кафе', files: ['script.js'] },
  };
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  // подсветка ТЗ: шаги, метки «Что/Зачем/Проверка», код и рамки
  const paint = (text) => esc(text)
    .replace(/^(.*(═|<!--|-->|\/\*|\*\/).*)$/gm, '<span class="br">$1</span>')
    .replace(/(── (?:ШАГ|БОНУС|ВОПРОСЫ)[^─\n]*)/g, '<span class="st">$1</span>')
    .replace(/(^|\s)(Что|Зачем|Как|Повторяем|Проверка|Ответы|Вопрос):/gm, '$1<span class="$2">$2:</span>')
    .replace(/class="(Что|Зачем|Как|Повторяем)"/g, 'class="lb"').replace(/class="(Проверка|Ответы|Вопрос)"/g, 'class="ok"')
    .replace(/(^|\s)(Нельзя|ВНИМАНИЕ):/gm, '$1<span class="no">$2:</span>')
    .replace(/(&lt;[a-z!][^&\n]*?&gt;|#[0-9a-f]{6}\b|\b(?:img|css)\/[\w.]+|\b[a-z-]+\.(?:css|html|svg)\b|\b\d+px\b|rgb\([^)]*\)|\b(?:sans-serif|serif|Georgia|Arial)\b)/g, '<span class="cd">$1</span>');
  const key = new URLSearchParams(location.search).get('p');
  const set = SETS[key] || SETS.joint;
  const name = SETS[key] ? key : 'joint';
  document.getElementById('title').textContent = set.title;
  document.title = set.title + ' · JS 2';
  document.getElementById('zip').href = '/materials/' + name + '.zip';
  const box = document.getElementById('files');
  set.files.forEach(async (f) => {
    const h = document.createElement('h2'); h.textContent = name + '/' + f;
    const pre = document.createElement('pre'); pre.className = 'c';
    box.append(h, pre);
    try { pre.innerHTML = paint(await (await fetch('/materials/' + name + '/' + f)).text()); } catch (e) { pre.textContent = 'Не удалось загрузить файл'; }
  });
</script>
</body>
</html>
